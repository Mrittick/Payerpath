<!-- ==========================================================================
     Checkbox Dataviz
     Figma: Checkbox Dataviz (323:2925)

     Structure:
       Host (role=checkbox, data-series attribute drives CSS custom properties)
         ├─ .cdataviz__box    (20×20, padding 4, radius 6 — series-coloured border)
         │    └─ .cdataviz__icon  (tick icon, hidden when unchecked)
         └─ .cdataviz__label  (series label text)

     Series 01–08: border and fill colours driven by [data-series] CSS selectors.
     No indeterminate / Mixed state (Figma: Unchecked/Checked only).
     ========================================================================== -->

<div class="cdataviz__box">
  <merces-icon
    name="tick"
    type="bold"
    size="tiny"
    class="cdataviz__icon"
  />
</div>
<span class="cdataviz__label paragraph-ui-thin">{{ label() }}</span>
