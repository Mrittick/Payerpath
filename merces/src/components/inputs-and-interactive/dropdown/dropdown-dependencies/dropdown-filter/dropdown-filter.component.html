<merces-search
  class="dropdown-filter-search"
  size="base"
  [placeholder]="placeholder()"
  [(value)]="searchValue"
  (search)="searched.emit($event)"
/>

@if (hasFilter()) {
  <merces-filter
    class="dropdown-filter-toggle"
    [mode]="filterMode()"
    [isActive]="filterActive()"
    (toggled)="filterToggled.emit()"
  />
}
