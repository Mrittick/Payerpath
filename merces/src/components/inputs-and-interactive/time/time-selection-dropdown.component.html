<!-- Scrollable time list -->
<div class="time-panel__content">
  @for (entry of entries(); track entry.value) {
    <button
      type="button"
      class="time-row"
      [class.time-row--current]="entry.value === value()"
      [class.time-row--disabled]="entry.disabled"
      [disabled]="entry.disabled || null"
      (click)="onRowClick(entry)"
    >
      <!-- Tick icon: visible (opacity 1) when row is current selection -->
      <merces-icon
        class="time-row__tick"
        name="tick"
        size="tiny"
        type="bold"
      />

      <!-- Time label + optional meridian -->
      <span class="time-row__time">
        <span class="paragraph-ui time-row__label">{{ entry.label }}</span>
        @if (entry.meridian) {
          <span class="paragraph-ui time-row__meridian">{{ entry.meridian }}</span>
        }
      </span>
    </button>
  }
</div>
