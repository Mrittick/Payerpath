<div class="te__inner">
  @if (type() === 'selection') {
    <!-- Selection: checkbox is purely visual — host is the focus/interaction target -->
    <span class="te__checkbox-wrap" [attr.inert]="''" aria-hidden="true">
      <merces-checkbox-table
        [size]="size()"
        hierarchy="entry"
        theme="brand"
        [checked]="isChecked()"
        [indeterminate]="isIndeterminate()"
      />
    </span>
  } @else if (type() === 'action') {
    <!-- Action: CTA button owns its own interaction -->
    <merces-cta-button
      intent="brand"
      type="primary"
      variant="icon-right"
      [size]="size()"
      [label]="buttonLabel()"
      [icon]="buttonIcon()"
    />
  } @else {
    <!-- String: display text -->
    <span
      class="te__text"
      [class.paragraph-ui-thin]="size() === 'base'"
      [class.paragraph-p4]="size() === 'mini'"
    >{{ text() }}</span>
  }
</div>
