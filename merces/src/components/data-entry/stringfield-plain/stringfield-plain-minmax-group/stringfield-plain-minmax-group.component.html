<!-- Mainframe — label + inputs side by side (horizontal) or stacked (vertical) -->
<div class="mmg__mainframe">

  <div class="mmg__label">
    <span class="paragraph-ui mmg__label-text">{{ label() }}</span>
  </div>

  <!-- Inputs frame — two projected string fields side by side -->
  <div class="mmg__inputs">
    <ng-content />
  </div>

</div>

<!-- Validation frame — always in DOM, animated by global ds-slot system -->
<div class="mmg__validation ds-slot" [class.ds-slot--open]="showMessage()">
  <div class="ds-slot__inner">
    <merces-stringfield-message
      [type]="messageType()"
      [text]="message()"
    />
  </div>
</div>
