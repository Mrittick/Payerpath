<!-- Trigger (standard mode only — hidden in panelOnly mode) -->
@if (!panelOnly()) {
  <button
    class="dropdown-trigger"
    type="button"
    [disabled]="isDisabled()"
    (click)="onTriggerClick()"
  >
    <span
      class="paragraph-ui-thin dropdown-text"
      [class.dropdown-text--placeholder]="unselected()"
    >{{ displayText() }}</span>
    <merces-icon
      class="dropdown-chevron"
      name="chevron-down"
      size="base"
      type="regular"
    />
  </button>
}

<!-- Panel (always in DOM, visibility via CSS animation) -->
<div class="dropdown-panel" role="listbox">
  <!-- Filter slot (fixed at top, does not scroll) -->
  <ng-content select="merces-dropdown-filter" />

  <!-- Scrollable content area -->
  <div class="dropdown-panel__content" (click)="onContentClick($event)">
    <ng-content />
  </div>

  <!-- Action slot (fixed at bottom, does not scroll) -->
  <ng-content select="merces-dropdown-action" />
</div>
