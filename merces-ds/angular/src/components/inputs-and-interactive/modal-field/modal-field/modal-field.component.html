<!-- Frame — the visible box with bg fill and border-radius -->
<div class="modal-field__frame">

  <!-- Block — fills width, contains text + optional mini chevron -->
  <div class="modal-field__block">
    <span
      class="paragraph-ui-thin modal-field__text"
      [class.modal-field__text--placeholder]="!selected()"
    >{{ displayText() }}</span>

    <!-- Mini chevron appears INSIDE block only when selected -->
    @if (selected()) {
      <merces-icon
        class="modal-field__sub-chevron"
        name="chevron-right"
        size="mini"
        type="regular"
      />
    }
  </div>

  <!-- Trailing element: Base chevron (unselected) or Clear (selected) -->
  @if (selected()) {
    <merces-clear
      class="modal-field__clear"
      size="mini"
      level="tertiary"
      [state]="isDisabled() ? 'disabled' : 'default'"
      (click)="onClear($event)"
    />
  } @else {
    <merces-icon
      class="modal-field__chevron"
      name="chevron-right"
      size="base"
      type="regular"
    />
  }
</div>
