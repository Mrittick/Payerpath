<!-- Figma: Navbar Item — 957:14560 -->

<!-- Category icon — only rendered for category items that have an icon assigned -->
@if (isCategory() && icon()) {
  <merces-icon
    [name]="icon()!"
    [type]="iconType()"
    size="large"
    aria-hidden="true"
  />
}

<!-- Label — category items: paragraph-ui (14px/700); subitems: paragraph-p4-bold (12px/700) -->
<span
  class="navbar-item__label"
  [class.paragraph-ui]="hierarchy() === 'item'"
  [class.paragraph-p4-bold]="hierarchy() === 'subitem'"
>{{ label() }}</span>

<!-- Chevron — only for non-standalone category items.
     Single icon rotated via CSS — mirrors how toggle-large handles direction.
     The icon path is centred within its 16×16 container; CSS rotates around
     the element's centre so there is no origin offset needed. -->
@if (isCategory() && type() !== 'standalone') {
  <merces-icon
    name="chevron-right"
    type="bold"
    size="mini"
    aria-hidden="true"
    class="navbar-item__chevron"
  />
}
