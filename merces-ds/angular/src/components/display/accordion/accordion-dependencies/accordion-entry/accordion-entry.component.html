<!-- Figma: Accordion Entry (821:19865)
     320w × 40h · HORIZONTAL · gap/md · radius/md
     Padding: gap/lg(t/b) gap/3xl(l/r) when NA · gap/1xs(t/b/r) gap/3xl(l) in edit modes
     Batch Edit: gap/lg(l) instead of gap/3xl -->

<!-- ── Batch Edit: checkbox on the left ────────────── -->
@if (showCheckbox()) {
  <span class="checkbox-wrapper" (click)="$event.stopPropagation()">
    <merces-checkbox
      size="mini"
      theme="brand"
      [checked]="isChecked()"
      [indeterminate]="isMixed()"
      [pressed]="pressed"
      [state]="isDisabled() ? 'disabled' : 'default'"
      (changed)="selectionChanged.emit()"
    />
  </span>
}

<!-- ── Label ─────────────────────────────────────────── -->
<span class="paragraph-ui-thin entry-label">{{ label() }}</span>

<!-- ── Edit / Remove actions on the right ──────────── -->
@if (showEdit() || showRemove()) {
  <span class="actions" (click)="$event.stopPropagation()">
    @if (showEdit()) {
      <merces-accordion-edit
        [disabled]="isDisabled()"
        (clicked)="onEditClick()"
      />
    }
    @if (showRemove()) {
      <merces-accordion-remove
        [disabled]="isDisabled()"
        (clicked)="onRemoveClick()"
      />
    }
  </span>
}
