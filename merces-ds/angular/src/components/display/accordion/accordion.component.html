<!-- Figma: Accordion (4089:42266)
     VERTICAL · gap/md between header and entries container
     Entries: paddingLeft gap/4xl · gap gap/1xs between rows
     Open/close animation: grid-template-rows 0fr → 1fr · 450ms cubic-bezier(0.5,0,0,1) -->

<merces-accordion-header
  [flavour]="flavour()"
  [hierarchy]="hierarchy()"
  [label]="label()"
  [isOpen]="isOpen()"
  [multiSelect]="mode() === 'batch-edit'"
  [headerCheckboxState]="headerCheckboxState()"
  (headerClick)="toggle()"
  (headerCheckboxChange)="onHeaderCheckboxChange()"
/>

<!-- Outer clip wrapper: always in DOM, height controlled by grid row -->
<div class="entries-clip" [attr.aria-hidden]="!isOpen()">
  <!-- Inner: must have min-height 0 for 0fr to work -->
  <div class="entries-inner">
    <div class="entries-container" [class.entries-container--batch]="mode() === 'batch-edit'" role="list">
      @for (entry of entries(); track $index) {
        <merces-accordion-entry
          [label]="entry"
          [editMode]="entryEditMode()"
          [selection]="entrySelections()[$index] ?? 'na'"
          (rowClicked)="onEntryRowClick($index)"
          (editClicked)="onEntryEdit($index)"
          (removeClicked)="onEntryRemove($index)"
          (selectionChanged)="onEntrySelectionChange($index)"
        />
      }
    </div>
  </div>
</div>
