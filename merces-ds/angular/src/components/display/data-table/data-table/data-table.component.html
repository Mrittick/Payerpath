@if (isEmpty()) {
  <merces-table-no-data />
} @else {
  <merces-overlay-scroll>
    <div class="inner" [style.grid-template-columns]="gridTemplate()">

      <!-- ── Sticky header row ── -->
      <div class="header-row">
        @if (showSelection()) {
          <merces-table-header
            type="checker"
            [variant]="columns()[0]?.extraLabel ? 'dual' : 'single'"
            [size]="size()"
            [selectionState]="headerSel()"
            (selectionChange)="toggleAll($event)"
          />
        }
        @for (col of columns(); track col.key; let i = $index) {
          <merces-table-header
            type="string"
            [variant]="col.extraLabel ? 'dual' : 'single'"
            [size]="size()"
            [mainText]="col.label"
            [extraText]="col.extraLabel ?? ''"
            [sortOrder]="(_sortColKey() === col.key) ? _sortDir() : 'none'"
            [resizable]="!col.frozen"
            (sortOrderChange)="handleSort(col.key, $event)"
            (resizeStart)="startResize(i, $event)"
            (resizeReset)="resetColumnWidth(i)"
          />
        }
      </div>

      <!-- ── Data rows ── -->
      @for (row of sortedRows(); track row; let rowIdx = $index) {
        <div
          class="row-wrapper"
          [style.height.px]="isRowLeaving(row) ? _leavingRowHeight() : (rowHeight() ?? null)"
          [style.opacity]="isRowLeaving(row) ? 0 : 1"
        >
          <merces-table-row
            [size]="size()"
            [alternating]="rowIdx % 2 === 1"
            (click)="toggleRow(row)"
            (keydown.enter)="$event.preventDefault(); toggleRow(row)"
            (keydown.space)="$event.preventDefault(); toggleRow(row)"
          >
            @if (showSelection()) {
              <merces-table-entry
                type="selection"
                [size]="size()"
                [interactive]="false"
                [selectionState]="isRowSelected(row) ? 'all' : 'none'"
              />
            }
            @for (col of columns(); track col.key) {
              <merces-table-entry
                type="string"
                [size]="size()"
                [text]="row[col.key] ?? ''"
              />
            }
          </merces-table-row>
        </div>
      }

    </div>
  </merces-overlay-scroll>
}
