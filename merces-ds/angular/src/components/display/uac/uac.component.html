<div class="uac-main">

  <!-- ── Avatar ── -->
  <div class="uac-avatar">
    @if (avatarUrl() && !_avatarError()) {
      <img class="uac-avatar-image" [src]="avatarSrc()" [alt]="name() + ' avatar'" (error)="onAvatarError()" />
    } @else {
      <div class="uac-avatar-fallback">
        <merces-icon name="user" type="regular" size="base" />
      </div>
    }
  </div>

  <!-- ── Text ── -->
  <div class="uac-text">
    <span class="uac-name paragraph-ui">{{ name() }}</span>
    <span class="uac-role paragraph-p4">{{ roleLabel() }}</span>
  </div>

</div>

<!-- ── Chevron indicator ── -->
<div class="uac-chevron" aria-hidden="true">
  <merces-icon [name]="chevronIconName()" type="bold" size="mini" />
</div>

<!-- ── Dropdown panel (merces-dropdown owns state, animation, border, radius) ── -->
<merces-dropdown
  [panelOnly]="true"
  [openAbove]="dropdownAbove()"
  (opened)="_isOpen.set(true)"
  (closed)="_isOpen.set(false)"
>
  <merces-dropdown-action label="Account Settings" icon="fix"      (pressed)="onAccountSettings()" />
  <merces-dropdown-action label="Sign Out"         icon="sign-out" (pressed)="onSignOut()" />
</merces-dropdown>
