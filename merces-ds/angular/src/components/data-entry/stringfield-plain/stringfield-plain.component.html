<!-- Frame — border, radius, bg fill, focus ring carrier -->
<div class="sf__frame" (click)="onFrameClick()">

  <!-- Input row — horizontal layout with padding -->
  <div class="sf__input-row">

    <!-- Content — grows to fill, holds native input -->
    <div class="sf__content">
      <input
        #inputEl
        class="paragraph-ui-thin sf__input"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="disabled()"
        (input)="onInput($event)"
        (focus)="onInputFocus()"
        (blur)="onInputBlur()"
        (click)="$event.stopPropagation()"
      />
    </div>

    <!-- Clear button — hidden (opacity 0) when empty -->
    <merces-clear
      class="sf__clear"
      size="mini"
      level="tertiary"
      [state]="clearState()"
      (pressed)="onClear()"
    />

  </div>
</div>

<!-- Validation message slot — always in DOM, animated by global ds-slot system -->
<div class="sf__message-slot ds-slot" [class.ds-slot--open]="showMessage()">
  <div class="sf__message-inner ds-slot__inner">
    <merces-stringfield-message
      [type]="validationState() === 'warning' ? 'warning' : 'error'"
      [text]="message()"
    />
  </div>
</div>
