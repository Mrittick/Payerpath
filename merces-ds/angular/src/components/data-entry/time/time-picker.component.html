<!-- Label -->
<span class="tp__label paragraph-ui">{{ label() }}</span>

<!-- Time field -->
<merces-time-field
  class="tp__field"
  [format]="format()"
  [validationState]="validationState()"
  [disabled]="disabled()"
  [(value)]="value"
/>

<!-- Validation message — animated by ds-slot system -->
<div class="tp__message-slot ds-slot" [class.ds-slot--open]="showMessage()">
  <div class="tp__message-inner ds-slot__inner">
    <merces-stringfield-message
      [type]="validationState() === 'warning' ? 'warning' : 'error'"
      [text]="message()"
    />
  </div>
</div>
