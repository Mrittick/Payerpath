<!-- Label row — omitted in standalone layout (parent provides section label) -->
@if (layout() !== 'standalone') {
  <div class="calrf__label-row">
    <span class="calrf__label paragraph-ui">{{ label() }}</span>
  </div>
}

<!-- Field wrap — position:relative anchors the overlay -->
<div class="calrf__field-wrap">

  <!-- Two date frames side by side — they share one calendar overlay -->
  <div class="calrf__frames">

    <!-- Start date frame -->
    <div
      class="calrf__frame calrf__frame--start"
      role="button"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-label]="'Range start: ' + (startDisplayText() || startPlaceholder())"
      [attr.aria-expanded]="_open()"
      [attr.aria-disabled]="disabled() || null"
      (click)="onFrameClick()"
      (keydown.enter)="onKeydownActivate($event)"
      (keydown.space)="onKeydownActivate($event)"
      (keydown.escape)="onEscape()"
    >
      <div class="calrf__input-row">
        <div class="calrf__content">
          <span
            class="calrf__display paragraph-ui-thin"
            [class.calrf__display--placeholder]="!rangeStart()"
          >{{ startDisplayText() || startPlaceholder() }}</span>
        </div>
        <merces-icon
          class="calrf__icon"
          name="date-picker"
          [type]="_open() ? 'filled' : 'regular'"
          size="base"
        />
      </div>
    </div>

    <!-- End date frame -->
    <div
      class="calrf__frame calrf__frame--end"
      role="button"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-label]="'Range end: ' + (endDisplayText() || endPlaceholder())"
      [attr.aria-expanded]="_open()"
      [attr.aria-disabled]="disabled() || null"
      (click)="onFrameClick()"
      (keydown.enter)="onKeydownActivate($event)"
      (keydown.space)="onKeydownActivate($event)"
      (keydown.escape)="onEscape()"
    >
      <div class="calrf__input-row">
        <div class="calrf__content">
          <span
            class="calrf__display paragraph-ui-thin"
            [class.calrf__display--placeholder]="!rangeEnd()"
          >{{ endDisplayText() || endPlaceholder() }}</span>
        </div>
        <merces-icon
          class="calrf__icon"
          name="date-picker"
          [type]="_open() ? 'filled' : 'regular'"
          size="base"
        />
      </div>
    </div>

  </div>

  <!-- Calendar overlay — always in DOM, opacity/pointer-events toggled via .calrf--open on host -->
  <div class="calrf__overlay" (click)="$event.stopPropagation()" (transitionend)="onOverlayTransitionEnd($event)">
    <merces-calendar-ui-ranged
      [(rangeStart)]="rangeStart"
      [(rangeEnd)]="rangeEnd"
      (rangeChanged)="onRangeChanged($event)"
    />
  </div>

</div>
