<!-- ── Left: branding · divider · module dropdown ── -->
<div class="header-left">

  <merces-branding product="payerpath" stacking="horizontal" type="default" />

  <div class="header-divider" role="separator" aria-hidden="true"></div>

  <div class="module-dropdown-wrap">
    <merces-dropdown
      [unselected]="moduleUnselected()"
      [selectionText]="moduleText()"
    >
      <merces-dropdown-item mode="single-select" label="Financial" [checked]="moduleText() === 'Financial'" />
    </merces-dropdown>
  </div>

</div>

<!-- ── Centre: date ── -->
<merces-date-display />

<!-- ── Right: UAC · help dropdown ── -->
<div class="header-right">

  <merces-uac
    product="payerpath"
    [name]="name()"
    [role]="role()"
    [avatarUrl]="avatarUrl()"
    (accountSettingsClick)="accountSettingsClick.emit()"
    (signOutClick)="signOutClick.emit()"
  />

  <merces-help-dropdown />

</div>
