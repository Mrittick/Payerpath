<div class="search-frame" (mousedown)="onMousedown()" (click)="onFrameClick()">
  <merces-icon
    class="search-icon"
    name="search"
    [size]="iconSize()"
    [type]="iconType()"
    label="Search"
  />

  <input
    #searchInput
    class="paragraph-ui-thin-stylised search-input"
    type="text"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />

  <merces-clear
    class="search-clear"
    size="base"
    level="tertiary"
    [state]="clearState()"
    label="Clear search"
    (pressed)="onClear()"
  />
</div>
