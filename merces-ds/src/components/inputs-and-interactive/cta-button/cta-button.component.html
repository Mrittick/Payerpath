<button
  class="cta-button__inner"
  type="button"
  [attr.aria-label]="variant() === 'icon-only' ? label() : null"
  [disabled]="disabled()"
  (pointerdown)="onPointerDown()"
  (pointerup)="onPointerUp()"
  (pointerleave)="onPointerUp()"
  (click)="onClick()"
>
  <!-- ── Compound (chevron=left): Chevron first ── -->
  @if (variant() === 'compound' && chevronPosition() === 'left') {
    <merces-icon
      class="cta-button__chevron"
      [name]="chevronIconName()"
      [size]="_resolvedIconSize()"
    />
  }

  <!-- ── Leading icon: icon-left, icon-only, compound (chevron=left has icon trailing) ── -->
  @if (variant() === 'icon-left' || variant() === 'icon-only') {
    <merces-icon
      class="cta-button__icon"
      [name]="icon()!"
      [type]="iconType()"
      [size]="_resolvedIconSize()"
    />
  }

  <!-- ── Compound leading icon (when chevron is right, icon is first) ── -->
  @if (variant() === 'compound' && chevronPosition() === 'right' && icon()) {
    <merces-icon
      class="cta-button__icon"
      [name]="icon()!"
      [type]="iconType()"
      [size]="_resolvedIconSize()"
    />
  }

  <!-- ── Text ── -->
  @if (hasText()) {
    <span class="cta-button__text paragraph-ui">{{ label() }}</span>
  }

  <!-- ── Trailing icon: icon-right ── -->
  @if (variant() === 'icon-right') {
    <merces-icon
      class="cta-button__icon"
      [name]="icon()!"
      [type]="iconType()"
      [size]="_resolvedIconSize()"
    />
  }

  <!-- ── Compound trailing icon (when chevron is left, icon goes last) ── -->
  @if (variant() === 'compound' && chevronPosition() === 'left' && icon()) {
    <merces-icon
      class="cta-button__icon"
      [name]="icon()!"
      [type]="iconType()"
      [size]="_resolvedIconSize()"
    />
  }

  <!-- ── Compound (chevron=right): Chevron last ── -->
  @if (variant() === 'compound' && chevronPosition() === 'right') {
    <merces-icon
      class="cta-button__chevron"
      [name]="chevronIconName()"
      [size]="_resolvedIconSize()"
    />
  }
</button>
