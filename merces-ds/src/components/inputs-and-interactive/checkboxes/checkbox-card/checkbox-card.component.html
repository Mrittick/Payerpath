<!-- ==========================================================================
     Checkbox Card
     Figma: Checkbox Card (608:8661) — Brand only; Neutral hook prepared.

     Structure:
       Host (role=checkbox, focus carrier — full card is interactive)
         └─ .cb-card__frame   (styled row — fills full width, carries bg + border)
              ├─ .cb-card__box   (visual checkbox — box + icon, not separately focusable)
              │    └─ .cb-card__icon
              └─ .cb-card__text  (label via ng-content)

     The host carries all interaction (click, keyboard, focus ring).
     The inner .cb-card__box is purely decorative — mirrors the checkbox visual.
     ========================================================================== -->

<div class="cb-card__frame">
  <div class="cb-card__box">
    <merces-icon
      name="tick"
      type="bold"
      [size]="iconSize()"
      class="cb-card__icon"
    />
  </div>
  <div class="cb-card__text">
    <span class="paragraph-ui-thin"><ng-content /></span>
  </div>
</div>
