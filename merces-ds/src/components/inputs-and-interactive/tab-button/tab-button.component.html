<button
  class="tab-button__inner"
  type="button"
  [attr.aria-disabled]="disabled() || null"
  (pointerdown)="onPointerDown()"
  (pointerup)="onPointerUp()"
  (pointerleave)="onPointerUp()"
  (click)="onClick()"
>
  <span
    class="tab-button__text"
    [class.paragraph-ui]="hierarchy() === 'level-02' || isCurrent() || disabled()"
    [class.paragraph-ui-thin]="hierarchy() === 'level-01' && !isCurrent() && !disabled()"
    [attr.data-text]="label()"
  >{{ label() }}</span>
</button>
